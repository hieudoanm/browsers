[workspace]
resolver = "2"
members = [
    "crates/browsers-cli",
    "crates/browsers-core",
    "crates/browsers-headless",
]

[workspace.dependencies]
servo = "=0.8.0"
clap = { version = "=4.6.7", features = ["derive", "string"] }
thiserror = "=2.0.21"
image = "=0.25.10"
url = "=2.5.8"
log = "=0.4.35"
env_logger = "=0.11.11"
winit = "=0.30.13"
dpi = "=0.1.2"
tracing = "=0.1.44"
tiny_http = "=0.12.0"
cssparser = "=0.38.0"
html5ever = "=0.40.1"
markup5ever = "=0.40.0"
reqwest = { version = "=0.13.5", features = ["json"] }
softbuffer = "=0.4.8"
