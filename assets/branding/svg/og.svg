<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="8" fill="#1d4ed8"/>

  <!-- logo mark -->
  <g transform="translate(90,120) scale(4.2)">
    <rect x="4" y="10" width="56" height="44" rx="8" fill="#1d4ed8"/>
    <rect x="4" y="10" width="56" height="12" rx="6" fill="#1e3a8a"/>
    <circle cx="12" cy="16" r="2" fill="#93c5fd"/>
    <circle cx="20" cy="16" r="2" fill="#93c5fd"/>
    <circle cx="28" cy="16" r="2" fill="#93c5fd"/>
    <rect x="12" y="18" width="40" height="5" rx="2.5" fill="#93c5fd" opacity="0.55"/>
    <circle cx="32" cy="38" r="11" fill="none" stroke="#ffffff" stroke-width="3"/>
    <ellipse cx="32" cy="38" rx="5" ry="11" fill="none" stroke="#ffffff" stroke-width="3"/>
    <line x1="21" y1="38" x2="43" y2="38" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="370" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="72" font-weight="700" fill="#0f172a">browserverless</text>
  <text x="374" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="30" fill="#475569">A browser, without the window.</text>
  <text x="374" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="22" fill="#64748b">Servo-powered headless rendering · CLI · HTTP API · MCP</text>

  <!-- terminal mock -->
  <rect x="90" y="400" width="1020" height="150" rx="14" fill="#0f172a"/>
  <circle cx="126" cy="436" r="7" fill="#f87171"/>
  <circle cx="152" cy="436" r="7" fill="#fbbf24"/>
  <circle cx="178" cy="436" r="7" fill="#34d399"/>
  <text x="126" y="492" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="26" fill="#e2e8f0">$ browserverless screenshot https://example.com -o page.png</text>
  <text x="126" y="534" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="24" fill="#38bdf8">Screenshot saved to page.png</text>

  <text x="90" y="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="20" fill="#94a3b8">github.com/hieudoanm/browsers</text>
</svg>
