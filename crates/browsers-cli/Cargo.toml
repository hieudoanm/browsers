[package]
name = "browsers-cli"
version = "0.0.1"
edition = "2021"
description = "Lightweight browser CLI powered by Servo"

[[bin]]
name = "browserverless"
path = "src/main.rs"

[dependencies]
browsers-core = { path = "../browsers-core" }
browsers-headless = { path = "../browsers-headless" }
clap = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
log = { workspace = true }
image = { workspace = true }
servo = { workspace = true }
winit = { workspace = true }
dpi = { workspace = true }
tracing = { workspace = true }
euclid = "=0.22.14"
libc = "=0.2.191"
tiny_http = { workspace = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
base64 = "=0.23.1"

[dev-dependencies]
