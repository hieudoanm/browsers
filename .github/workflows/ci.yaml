name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-check:
    name: CLI check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            cmake \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libglib2.0-dev \
            libdbus-1-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libgtk-3-dev \
            libx11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            libwayland-bin \
            libegl-dev \
            libgl-dev \
            zlib1g-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Run lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --verbose

  cli-build:
    name: CLI build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Release binaries are only needed for the master-branch release job;
    # PRs are covered by the `cli-check` job.
    if: github.event_name != 'pull_request'
    needs: cli-check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            cmake \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libglib2.0-dev \
            libdbus-1-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libgtk-3-dev \
            libx11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            libwayland-bin \
            libegl-dev \
            libgl-dev \
            zlib1g-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Build release binary
        run: cargo build --release -p browsers-cli

      - name: Rename binary for release
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest) mv target/release/browserverless browserverless-x86_64-unknown-linux-gnu ;;
            macos-latest) mv target/release/browserverless browserverless-aarch64-apple-darwin ;;
          esac

      - name: Upload CLI binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browsers-cli-${{ matrix.os }}
          path: browserverless-*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    needs: [cli-build]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          pattern: browsers-cli-*
          merge-multiple: true

      - name: Delete existing latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          git push origin :refs/tags/latest || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: latest
          name: Browserverless (latest)
          body_path: README.md
          files: dist/*

  landing-build:
    name: Landing - Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck landing
        run: pnpm --filter @browsers/landing run typecheck

      - name: Lint landing
        run: pnpm --filter @browsers/landing run lint

      - name: Build landing (Next.js static export)
        run: pnpm --filter @browsers/landing run build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: packages/landing/out

  landing-deploy:
    name: Landing - Deploy
    needs: landing-build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5.0.1
